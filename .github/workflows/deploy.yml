name: Deploy React Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Commit Info
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Message: ${{ github.event.head_commit.message }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Verify Build Output
        run: |
          ls -la dist/ || echo "dist/ not found"

      - name: Copy .htaccess (if exists)
        run: |
          if [ -f .htaccess ]; then
            cp .htaccess dist/
          fi

      - name: Upload Build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "dist/"
          target: "/tmp/hireon-fe-build"
          rm: true

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            echo "Received files:"
            ls /tmp/hireon-fe-build/dist/ || echo "dist/ missing in upload"

            sudo rsync -a --delete /tmp/hireon-fe-build/dist/ /var/www/html/hireon-fe/
            sudo rm -rf /tmp/hireon-fe-build

            sudo chown -R apache:apache /var/www/html/hireon-fe
            sudo chmod -R 755 /var/www/html/hireon-fe
            sudo find /var/www/html/hireon-fe -type f -exec chmod 644 {} \;

            sudo systemctl restart httpd

            echo "Deployed: $(ls /var/www/html/hireon-fe/ | wc -l) files live"
