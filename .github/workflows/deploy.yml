name: Deploy React Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Commit Info
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "SHA: $COMMIT_SHA"
          echo "Branch: $BRANCH_NAME"
          echo "Message: $COMMIT_MSG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Verify Build Output
        run: ls -la dist/

      - name: Copy .htaccess (if exists)
        run: |
          if [ -f .htaccess ]; then
            cp .htaccess dist/
          fi

      - name: Upload Build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: "dist/"
          target: "/tmp/hireon-fe-build"
          rm: true

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            if [ ! -d /tmp/hireon-fe-build/dist ] || [ -z "$(ls -A /tmp/hireon-fe-build/dist 2>/dev/null)" ]; then
              echo "Error: /tmp/hireon-fe-build/dist is missing or empty"
              exit 1
            fi

            sudo rsync -a --delay-updates --delete-delay /tmp/hireon-fe-build/dist/ /var/www/html/hireon-fe/
            sudo rm -rf /tmp/hireon-fe-build

            sudo chown -R apache:apache /var/www/html/hireon-fe
            sudo chmod -R 755 /var/www/html/hireon-fe
            sudo find /var/www/html/hireon-fe -type f -exec chmod 644 {} \;

            sudo systemctl restart httpd

            echo "Deployed: $(find /var/www/html/hireon-fe -type f | wc -l) files live"
